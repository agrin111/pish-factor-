name: Windows Installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'انتشار به عنوان GitHub Release (برای آپدیت خودکار کاربران)'
        type: boolean
        default: false
      release_version:
        description: 'شماره نسخه (مثلاً 1.0.1 — فقط در صورت انتشار Release)'
        type: string
        default: ''
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'app/**'
      - 'actions/**'
      - 'components/**'
      - 'lib/**'
      - 'prisma/**'
      - 'desktop/**'
      - 'assets/**'
      - 'public/**'
      - 'types/**'
      - 'scripts/build-desktop.mjs'
      - 'electron-builder.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/pishfactor?schema=public
      SESSION_SECRET: 'build-time-only-secret-not-used-at-runtime-000000'
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: همگام‌سازی نسخه برای Release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tagVersion = ""
          $shouldRelease = $false

          function Resolve-NextFreeVersion([string]$baseVersion) {
            $candidate = $baseVersion
            for ($i = 0; $i -lt 50; $i++) {
              gh release view "v$candidate" *> $null
              $releaseExists = ($LASTEXITCODE -eq 0)
              $tagRef = git ls-remote --tags origin "refs/tags/v$candidate" 2>$null
              $tagExists = -not [string]::IsNullOrWhiteSpace($tagRef)
              if (-not $releaseExists -and -not $tagExists) {
                return $candidate
              }
              $parts = $candidate.Split('.')
              if ($parts.Length -eq 3) {
                $candidate = "$($parts[0]).$($parts[1]).$([int]$parts[2] + 1)"
              } else {
                break
              }
            }
            return $candidate
          }

          if ("${{ github.ref_type }}" -eq "tag") {
            $tagVersion = "${{ github.ref_name }}".TrimStart('v')
            $shouldRelease = $true
          } elseif ("${{ inputs.release_version }}" -ne "") {
            $tagVersion = "${{ inputs.release_version }}".TrimStart('v')
            $shouldRelease = $true
          } elseif ("${{ inputs.publish_release }}" -eq "true") {
            $tagVersion = Resolve-NextFreeVersion $pkgVersion
            $shouldRelease = $true
          } elseif ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_name }}" -eq "main") {
            $tagVersion = Resolve-NextFreeVersion $pkgVersion
            $shouldRelease = $true
          }

          if ($shouldRelease -and $tagVersion -ne "") {
            npm version --no-git-tag-version --allow-same-version $tagVersion
            echo "tag=v$tagVersion" >> $env:GITHUB_OUTPUT
            echo "should_release=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "should_release=false" >> $env:GITHUB_OUTPUT
          }

      - name: نصب وابستگی‌ها
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue package-lock.json
          npm install --no-audit --no-fund

      - name: ساخت برنامه Next.js
        run: npm run build

      - name: ساخت نصب‌کننده و نسخه پرتابل ویندوز
        run: npm run desktop:build

      - name: بارگذاری خروجی‌ها به عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AghrinPishFactor-Windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: بارگذاری نسخه بدون نصب (پوشه آماده اجرا)
        uses: actions/upload-artifact@v4
        with:
          name: AghrinPishFactor-NoInstall
          path: release/win-unpacked/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: انتشار در GitHub Releases (برای به‌روزرسانی خودکار)
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Aghrin PishFactor ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            release/latest.yml
            release/AghrinPishFactor-Setup-*.exe
            release/AghrinPishFactor-Setup-*.exe.blockmap
            release/AghrinPishFactor-Portable-*.exe
