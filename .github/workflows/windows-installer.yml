name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'actions/**'
      - 'components/**'
      - 'lib/**'
      - 'prisma/**'
      - 'desktop/**'
      - 'assets/**'
      - 'public/**'
      - 'scripts/build-desktop.mjs'
      - 'desktop/build-windows.bat'
      - 'electron-builder.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-installer.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/pishfactor?schema=public
      SESSION_SECRET: 'build-time-only-secret-not-used-at-runtime-000000'
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: نصب وابستگی‌ها
        run: npm ci

      - name: ساخت برنامه Next.js
        run: npm run build

      - name: ساخت نصب‌کننده و نسخه پرتابل ویندوز
        run: npm run desktop:build

      - name: بارگذاری خروجی‌ها
        uses: actions/upload-artifact@v4
        with:
          name: AghrinPishFactor-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      # نسخه «بدون نصب» به شکل پوشه آماده اجرا؛ نه نصب می‌خواهد و نه از
      # خوداستخراج‌کننده NSIS استفاده می‌کند. کاربر پوشه را از zip خارج می‌کند
      # و «Aghrin Pish Factor.exe» را دوبار کلیک می‌کند.
      - name: بارگذاری نسخه بدون نصب (پوشه آماده اجرا)
        uses: actions/upload-artifact@v4
        with:
          name: AghrinPishFactor-NoInstall
          path: release/win-unpacked/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
