name: Build Windows Installer (.exe)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests & type check
        run: |
          npm test
          npm run lint

      - name: Build production web bundle
        run: npm run build

      - name: Install Electron & electron-builder
        run: npm install --no-save electron@35.1.5 electron-builder@26.0.12

      - name: Build Windows .exe installers
        run: npx electron-builder --win --x64 --config electron-builder.yml --publish never

      - name: Upload .exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aghrin-PishFactor-Windows-EXE
          path: |
            release/*.exe
            !release/*unpacked*
          retention-days: 90

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-windows' }}
          name: Aghrin PishFactor Windows Installer
          body: |
            نسخه نصب ویندوز سامانه **Aghrin PishFactor** شرکت آهن آگرین:
            - `Aghrin-PishFactor-Setup-*.exe`: فایل نصبی استاندارد ویندوز (با ساخت میانبر دسکتاپ)
            - `Aghrin-PishFactor-Portable-*.exe`: نسخه پرتابل بدون نیاز به نصب
          files: |
            release/Aghrin-PishFactor-Setup-*.exe
            release/Aghrin-PishFactor-Portable-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
