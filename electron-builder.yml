appId: ir.agrin.pishfactor
productName: Aghrin PishFactor
copyright: شرکت آهن آگرین

directories:
  output: release
  buildResources: desktop

# انتشار به‌روزرسانی‌های ویندوز از طریق GitHub Releases
publish:
  provider: github
  owner: agrin111
  repo: pish-factor-
  releaseType: release

# پوسته دسکتاپ + وابستگی‌های تولیدی (prisma/embedded-postgres/pg/electron-updater) به‌صورت خودکار
files:
  - desktop/**
  - '!desktop/build-windows.bat'
  - package.json
  - '!**/*.map'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,test,tests,__tests__,docs,example,examples}'

# برنامه Next.js (پس از اجرای scripts/build-desktop.mjs آماده است)
extraResources:
  - from: .next/standalone
    to: app/.next/standalone
  - from: prisma/migrations
    to: app/prisma/migrations

# asar خاموش است تا فایل‌های اجرایی PostgreSQL همراه برنامه قابل اجرا بمانند
asar: false

win:
  target:
    # نصب‌کننده معمولی (میان‌بر دسکتاپ، منوی Start و پشتیبانی از آپدیت خودکار)
    - target: nsis
      arch:
        - x64
    # نسخه پرتابل: یک فایل exe که با دوبار کلیک و بدون نصب اجرا می‌شود
    - target: portable
      arch:
        - x64
  icon: desktop/icon.ico
  artifactName: AghrinPishFactor-Setup-${version}.${ext}

portable:
  artifactName: AghrinPishFactor-Portable-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Aghrin PishFactor
  runAfterFinish: true
  deleteAppDataOnUninstall: false
